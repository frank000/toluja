<div class="app-shell" [class.app-shell--watermark]="(loggedIn() && !isLoginRoute()) || isGuestRoute()">
  <nav class="app-topbar" *ngIf="loggedIn() && !isLoginRoute()">
    <div class="app-topbar__inner">
      <a class="app-brand" routerLink="/pedido">
        <span class="app-brand__mark">
          <img src="assets/logo transparente.png" alt="Toluja Go" class="brand-logo" />
        </span>
        <span class="app-brand__text">Toluja GO</span>
      </a>

      <div class="navbar-main w-100">
        <ul class="app-nav d-none d-md-flex">
          <li class="nav-item" *ngIf="!mustChangePassword() && isAdmin()">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-bar-chart"></i>Dashboard</a>
          </li>
          <li class="nav-item" *ngIf="!mustChangePassword()">
            <a class="nav-link" routerLink="/itens" routerLinkActive="active"><i class="bi bi-grid"></i>Itens</a>
          </li>
          <li class="nav-item" *ngIf="!mustChangePassword()">
            <a class="nav-link" routerLink="/pedido" routerLinkActive="active"><i class="bi bi-plus-square"></i>Novo Pedido</a>
          </li>
          <li class="nav-item" *ngIf="!mustChangePassword()">
            <a class="nav-link" routerLink="/pedidos" routerLinkActive="active"><i class="bi bi-card-list"></i>Pedidos</a>
          </li>
          <li class="nav-item" *ngIf="!mustChangePassword() && isAdmin()">
            <a class="nav-link" routerLink="/configuracao" routerLinkActive="active"><i class="bi bi-gear"></i>Configuração</a>
          </li>
          <li class="nav-item" *ngIf="mustChangePassword()">
            <a class="nav-link" routerLink="/trocar-senha" routerLinkActive="active"><i class="bi bi-key"></i>Trocar senha</a>
          </li>
        </ul>

        <div class="mobile-nav d-flex d-md-none" *ngIf="!mustChangePassword()">
          <a class="btn app-icon-btn" *ngIf="isAdmin()" routerLink="/dashboard" routerLinkActive="active" title="Dashboard" aria-label="Dashboard"><i class="bi bi-bar-chart"></i></a>
          <a class="btn app-icon-btn" routerLink="/itens" routerLinkActive="active" title="Itens" aria-label="Itens"><i class="bi bi-grid"></i></a>
          <a class="btn app-icon-btn" routerLink="/pedido" routerLinkActive="active" title="Novo Pedido" aria-label="Novo Pedido"><i class="bi bi-plus-square"></i></a>
          <a class="btn app-icon-btn" routerLink="/pedidos" routerLinkActive="active" title="Pedidos" aria-label="Pedidos"><i class="bi bi-card-list"></i></a>
          <a class="btn app-icon-btn" *ngIf="isAdmin()" routerLink="/configuracao" routerLinkActive="active" title="Configuração" aria-label="Configuração"><i class="bi bi-gear"></i></a>
        </div>

        <div class="mobile-nav d-flex d-md-none" *ngIf="mustChangePassword()">
          <a class="btn app-icon-btn" routerLink="/trocar-senha" routerLinkActive="active" title="Trocar senha" aria-label="Trocar senha"><i class="bi bi-key"></i></a>
        </div>

        <div class="session-actions d-flex align-items-center gap-2">
          <span class="session-pill d-none d-lg-inline-flex" *ngIf="user()">
            <span>{{ user()?.nomeExibicao }}</span>
            <small>{{ user()?.role }}</small>
          </span>
          <button class="btn btn-light btn-sm app-logout" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            Sair
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main [class]="isLoginRoute() ? '' : 'app-main container-fluid'">
    <router-outlet></router-outlet>
  </main>
</div>
