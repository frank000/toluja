<div class="login-page">
  <button class="btn btn-outline-secondary btn-sm painel-btn" type="button" (click)="togglePainelMode()">
    {{ painelMode ? 'Voltar ao login padrão' : 'Painel Superadmin' }}
  </button>

  <div class="login-shell shadow-lg">
    <div class="login-logo-panel">
      <img src="assets/logo transparente.png" alt="Toluja Go" class="login-logo" />
    </div>

    <div class="login-form-panel">
      <h4 class="mb-4 text-center">{{ painelMode ? 'Entrar no Painel Superadmin' : 'Entrar' }}</h4>
      <form [formGroup]="form" (ngSubmit)="submit()" class="d-grid gap-3">
        <div *ngIf="!painelMode">
          <label class="form-label">Tenant</label>
          <div class="tenant-combobox">
            <input
              class="form-control"
              type="text"
              formControlName="tenantId"
              autocomplete="off"
              [disabled]="carregandoTenants"
              (focus)="tenantSelectAberto = true"
              (input)="onTenantInput($any($event.target).value)"
            />
            <button
              class="tenant-combobox-toggle"
              type="button"
              [disabled]="carregandoTenants"
              (click)="tenantSelectAberto = !tenantSelectAberto"
              aria-label="Listar tenants"
            >
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="tenant-combobox-menu shadow-sm" *ngIf="tenantSelectAberto && !carregandoTenants">
              <button
                class="tenant-combobox-option"
                type="button"
                *ngFor="let tenant of tenantsFiltrados"
                (click)="selecionarTenant(tenant.tenantId)"
              >
                <span>{{ tenant.tenantId }}</span>
                <small>{{ tenant.nome }}</small>
              </button>
              <div class="tenant-combobox-empty" *ngIf="tenantsFiltrados.length === 0">
                Nenhum tenant encontrado.
              </div>
            </div>
          </div>
        </div>
        <div>
          <label class="form-label">Usuário</label>
          <input class="form-control" type="text" formControlName="username" />
        </div>
        <div>
          <label class="form-label">Senha</label>
          <input class="form-control" type="password" formControlName="password" />
        </div>
        <button class="btn btn-primary login-submit" type="submit" [disabled]="loading">
          {{ loading ? 'Entrando...' : (painelMode ? 'Entrar no painel' : 'Entrar') }}
        </button>
      </form>
      <div class="alert alert-danger mt-3 mb-0" *ngIf="erro">{{ erro }}</div>
    </div>
  </div>
</div>
